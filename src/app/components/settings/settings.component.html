<section class="section-view music-view">
  <div class="section-title">
    <div class="music-heading"><div><span class="kicker">MUSIC / 03</span><h2>Music Project</h2></div><a class="spotify-header-logo" href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Spotify"><fa-icon [icon]="faSpotify" /></a></div>
  </div>

  <div class="album-grid">
    @for (album of albums; track album.title; let i = $index) {
      <button type="button" class="album" [class.selected]="selectedAlbum() === i" [style.--album-color]="album.color" (click)="selectAlbum(i)">
        <span class="album-art"><fa-icon [icon]="faMusic" /><b>{{ i + 1 }}</b></span><strong>{{ album.title }}</strong><small>Álbum / {{ i + 1 }}</small>
      </button>
    }
  </div>

  <div class="track-card"><span class="kicker">NOW PLAYING</span><h3>{{ albums[selectedAlbum()].title }}</h3><p>{{ albums[selectedAlbum()].subtitle }}</p><audio #audio src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" (play)="playing.set(true)" (pause)="playing.set(false)" controls></audio></div>

  <div class="playlist">
    @for (album of albums; track album.title; let i = $index) {
      <button type="button" class="playlist-row" [class.active]="selectedAlbum() === i" (click)="selectAlbum(i)">
        <span class="track-number">0{{ i + 1 }}</span><span class="track-copy"><b>{{ album.title }}</b><small>{{ album.subtitle }}</small></span><i [style.background]="album.color"></i><fa-icon [icon]="faForwardStep" />
      </button>
    }
  </div>

</section>
